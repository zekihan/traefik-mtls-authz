version: "2"
run:
  timeout: 5m
  tests: true
  build-tags:
    - integration
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: standard
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      exclude-functions: [fmt.Fprintln]
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets: [common-false-positives, std-error-handling]
    rules:
      - path: _test\.go$
        linters: [errcheck]
formatters:
  enable: [gofmt]
  exclusions:
    generated: lax
