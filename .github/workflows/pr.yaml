name: Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      publishing:
        description: Run container and release validation before publication
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags=integration
      - run: python3 -m pip install -r scripts/requirements-docs.txt
      - run: make check/docs
      - run: make tidy && git diff --exit-code
      - run: make lint
      - run: make test
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make test/integration
    if: ${{ inputs.publishing }}
