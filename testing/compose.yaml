# Linux host networking lets the Go harness supply a backend on an ephemeral port.
# All PKI material is generated in an ephemeral directory by the test runner.
services:
  traefik:
    image: traefik:v3.7.17@sha256:92627e6a99f71b8e46634acea28130b9f14bec5d9887ad15161007e1b652afe1
    network_mode: host
    command: [--configFile=/fixture/static.json]
    volumes:
      - ${MTLS_FIXTURE_DIR:?fixture directory required}:/fixture:ro
      - ${MTLS_FIXTURE_DIR:?fixture directory required}/logs:/logs
      - ${MTLS_SOURCE_DIR:?source directory required}:/plugins-local/src/github.com/zekihan/traefik-mtls-authz:ro
